title: Amirul Cyber
description: CyberSec | Research | South East Asia
url: https://amirulcyber.com
baseurl: ""
author: Amirul Cyber
timezone: Asia/Kuala_Lumpur

markdown: kramdown
# Keep the proven post URL scheme (/YYYY/MM/DD/slug/) so existing
# inbound links + og-cards keep resolving. Posts also carry explicit
# permalinks in front matter; this covers any without one.
permalink: /:year/:month/:day/:title/

# jekyll-seo-tag fallback og:image for posts/pages without their own
image: /assets/img/og-card.jpg

plugins:
  - jekyll-feed
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: article
      image: /assets/img/og-card.jpg

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
