# The Site Configuration
theme: jekyll-theme-chirpy

# The language of the website
lang: en

# Set the site's title <title>
title: Amirul Cyber

# Set the site's description
description: >-
  CyberSec | Research | South East Asia

# Set the site's domain
url: 'https://amirulcyber.github.io'

# BaseURL for subfolders
baseurl: ''

# Force HTTPS
ssl: true

# the avatar on sidebar
avatar: 'https://avatars.githubusercontent.com/u/amirulcyber?v=4'

# Site author
author: Amirul Cyber
contact_email: contact@amirulcyber.com

# boolean type, the global switch for ToC in posts.
toc: true

# Self comments (visit https://utteranc.es for more info)
comments:
  active: utterances
  utterances:
    repo: amirulcyber/amirulcyber.github.io
    issue_term: pathname
    theme: preferred-color-scheme

# Paginate settings
paginate: 10

# the avatar on sidebar, support local or CORS resources
avatar_alt: 'Amirul Cyber'

posts_last_modified_at:
  date_format: '%b %d, %Y'

# Uncomment the following line to use the Dark Mode Toggle
theme_mode: # [light | dark]

markdown: kramdown
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight

# Social media and contact links
social:
  name: Amirul Cyber
  email: contact@amirulcyber.com
  links:
    - https://amirulcyber.carrd.co
    - https://twitter.com/amirulcyber
    - https://github.com/amirulcyber

github:
  username: amirulcyber

twitter:
  username: amirulcyber

# Timezone
timezone: Asia/Kuala_Lumpur

# Collections
collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ''
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: '_drafts'
      type: posts
    values:
      comments: false
  - scope:
      path: ''
      type: tabs
    values:
      layout: page
      permalink: /:title/

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-archives
  - jekyll-sitemap
  - jekyll-include-cache

exclude:
  - '*.gem'
  - '*.gemspec'
  - tools
  - docs
  - README.md
  - CHANGELOG.md
  - LICENSE
  - gulpfile.js
  - node_modules
  - package*.json
