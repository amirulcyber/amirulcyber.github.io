theme: jekyll-theme-merlot
title: Amirul Cyber
description: CyberSec | Research | South East Asia
url: https://amirulcyber.github.io

# Link-preview cards. WhatsApp/Telegram need og:image; Twitter needs a large
# card type. og:image is emitted in _layouts/default.html (first image of a
# post, else /assets/img/og-card.jpg) because jekyll-seo-tag can't auto-extract
# from post content. Absolute URLs derive from `url` above.
defaults:
  - scope:
      path: ""
    values:
      twitter:
        card: summary_large_image

# Clean, predictable post URLs: /YYYY/MM/DD/slug/
# Jekyll's default permalink expands `categories` into the URL
# (e.g. /cybersecurity/threat-intelligence/2026/08/31/slug.html),
# which broke the "Read full post" links -> 404.
permalink: /:year/:month/:day/:title/
