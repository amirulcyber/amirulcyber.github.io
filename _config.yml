theme: jekyll-theme-merlot
title: Amirul Cyber
description: CyberSec | Research | South East Asia
url: https://amirulcyber.github.io

# Link-preview cards. WhatsApp/Telegram need og:image; Twitter uses a large
# card when an image is present. The site-wide image below is the fallback;
# posts override it with their first <img> in _layouts/default.html.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/og-card.jpg

# Clean, predictable post URLs: /YYYY/MM/DD/slug/
# Jekyll's default permalink expands `categories` into the URL
# (e.g. /cybersecurity/threat-intelligence/2026/08/31/slug.html),
# which broke the "Read full post" links -> 404.
permalink: /:year/:month/:day/:title/
