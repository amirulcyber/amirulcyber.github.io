---
layout: default
---
<main class="container container--wide main--home">
  <section class="home__intro">
    <div class="home__copy">
      {{ content }}
    </div>
  </section>

  <h2 class="home__recent-heading">Recent writing</h2>
  <div class="essay-list">
    {%- for post in site.posts limit: 5 -%}
    <a class="essay-card" href="{{ post.url | relative_url }}">
      <span class="essay-card__inner">
        <span class="essay-card__title">{{ post.title | smartify }}</span>
        <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%d %B %Y' }}</time>
      </span>
    </a>
    {%- endfor -%}
  </div>

  <a class="home__all-link" href="{{ '/blog/' | relative_url }}">View all posts →</a>
</main>
